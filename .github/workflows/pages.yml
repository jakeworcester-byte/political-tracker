name: Publish site to gh-pages

# GitHub Pages for this repository serves the gh-pages branch (Pages auto-enabled when that
# branch was first pushed). This workflow mirrors docs/ from main into gh-pages on every push,
# so the daily routine's push to main republishes the site without any Pages settings.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push docs/ to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch docs/.nojekyll
          git add docs/.nojekyll
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "nojekyll" || true
          SPLIT=$(git subtree split --prefix docs HEAD)
          git push --force origin "$SPLIT:refs/heads/gh-pages"
          echo "published $SPLIT to gh-pages"
